[project]
name = "dev-setup"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "KumruCelik", email = "celikumru13@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.2",
    "pandas>=3.0.5",
]

[project.scripts]
dev-setup = "dev_setup:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
]
